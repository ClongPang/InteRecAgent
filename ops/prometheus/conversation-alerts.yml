groups:
  - name: interec-conversation-slo
    rules:
      - alert: InteRecApiEnqueueP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(rec_agent_api_enqueue_duration_seconds_bucket[10m]))) > 0.3
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Conversation Turn enqueue P95 exceeds 300 ms" }
      - alert: InteRecProjectionP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(rec_agent_api_projection_duration_seconds_bucket[10m]))) > 0.5
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Conversation projection P95 exceeds 500 ms" }
      - alert: InteRecSseLagP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(rec_agent_sse_lag_duration_seconds_bucket[10m]))) > 1
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "SSE event lag P95 exceeds 1 second" }
      - alert: InteRecQueueWaitP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(rec_agent_queue_wait_duration_seconds_bucket[10m]))) > 2
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Turn queue wait P95 exceeds 2 seconds" }
      - alert: InteRecLocalTurnP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(rec_agent_turn_duration_seconds_bucket{route=~"talk|clarify|refilter|rerank"}[10m]))) > 8
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Zero-provider Turn P95 exceeds 8 seconds" }
      - alert: InteRecResearchTurnP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(rec_agent_turn_duration_seconds_bucket{route="research"}[10m]))) > 45
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Research Turn P95 exceeds 45 seconds" }
      - alert: InteRecResearchTurnP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(rec_agent_turn_duration_seconds_bucket{route="research"}[10m]))) > 60
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Research Turn P99 exceeds 60 seconds" }
      - alert: InteRecTurnFailureRateHigh
        expr: sum(rate(rec_agent_turn_terminal_total{status="FAILED"}[15m])) / clamp_min(sum(rate(rec_agent_turn_terminal_total[15m])), 0.000001) > 0.01
        for: 15m
        labels: { severity: P1 }
        annotations: { summary: "Turn failure rate exceeds 1%" }
      - alert: InteRecTurnTimeoutRateHigh
        expr: sum(rate(rec_agent_turn_terminal_total{status="TIMED_OUT"}[15m])) / clamp_min(sum(rate(rec_agent_turn_terminal_total[15m])), 0.000001) > 0.01
        for: 15m
        labels: { severity: P1 }
        annotations: { summary: "Turn timeout rate exceeds 1%" }
  - name: interec-conversation-safety
    rules:
      - alert: InteRecClaimValidationFailureRateHigh
        expr: increase(rec_agent_claim_validation_failures_total[15m]) > 5
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Claim-validation blocks are sustained above the operational threshold" }
      - alert: InteRecSafetyBlockRateHigh
        expr: increase(rec_agent_safety_blocks_total[15m]) > 5
        for: 10m
        labels: { severity: P1 }
        annotations: { summary: "Safety-boundary blocks are sustained above the operational threshold" }
      - alert: InteRecOutboxDeadLetter
        expr: increase(rec_agent_outbox_dead_letters_total[5m]) > 0
        for: 0m
        labels: { severity: P1 }
        annotations: { summary: "Conversation event entered the outbox dead letter state" }
