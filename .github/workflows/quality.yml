name: quality

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run acceptance
      - run: git diff --check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: interec
          POSTGRES_PASSWORD: interec
          POSTGRES_DB: interec_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interec -d interec_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEREC_DATABASE_URL: postgresql://interec:interec@127.0.0.1:5432/interec_test
      RUN_CONVERSATION_PG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:integration
