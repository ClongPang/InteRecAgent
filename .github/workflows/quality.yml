name: quality

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retail_price
          POSTGRES_PASSWORD: retail_price
          POSTGRES_DB: retail_price_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail_price -d retail_price_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RETAIL_PRICE_DATABASE_URL: postgresql://retail_price:retail_price@127.0.0.1:5432/retail_price_test
      RUN_CONVERSATION_PG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run acceptance
      - run: git diff --check
