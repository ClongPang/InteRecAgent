name: interecagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interec
      POSTGRES_PASSWORD: interec
      POSTGRES_DB: interec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interec -d interec"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
