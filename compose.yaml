name: retailpriceagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retail_price
      POSTGRES_PASSWORD: retail_price
      POSTGRES_DB: retail_price
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_price -d retail_price"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
