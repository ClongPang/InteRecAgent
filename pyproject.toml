[project]
name = "interecagent"
version = "0.1.0"
description = "Traceable cross-border shopping recommendation agent (InteRecAgent)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "langgraph>=0.2.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "structlog>=24.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "import-linter>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".test-cache"
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
markers = [
  "unit: 领域与应用层单元测试（默认离线）",
  "contract: 供应商与 API 契约测试（脱敏 fixture，无外网）",
  "integration: 跨模块集成与 PostgreSQL 测试",
  "agent: Agent 状态图编排测试",
  "api: FastAPI HTTP/SSE 契约测试",
  "architecture: 导入依赖方向与禁止项扫描",
  "live: 需要真实 BuyWhere API Key 和网络的冒烟测试（默认跳过）",
]

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["backend/tests/*", "backend/main.py", "backend/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008：FastAPI 惯用法 Depends(...) 在参数默认值中；B904：FastAPI 异常映射用 raise from 无关
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
