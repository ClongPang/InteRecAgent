[project]
name = "interecagent"
version = "0.1.0"
description = "Traceable conversational game recommendation agent MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "respx>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "artifact: requires generated game catalog artifacts under data/games",
  "integration: cross-module integration checks",
  "live: requires real BuyWhere API key and network (skipped without it)",
]
